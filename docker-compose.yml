version: '3.8'

services:
  db_postgres:
    image: postgres:15
    container_name: puerto_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: puerto_db
    ports:
      - "5433:5432" 
    volumes:
      - pg_data:/var/lib/postgresql/data

  db_influx:
    image: influxdb:2.7
    container_name: puerto_influx
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: puerto_org
      DOCKER_INFLUXDB_INIT_BUCKET: telemetria
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mi_token_secreto_123
    volumes:
      - influx_data:/var/lib/influxdb2

  backend:
    build: ./backend
    container_name: puerto_backend
    ports:
      - "8000:8000"
    depends_on:
      - db_postgres
      - db_influx

  frontend:
    image: nginx:alpine
    container_name: puerto_frontend
    ports:
      - "80:80"
    volumes:
      - ./app_puerto/build/web:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  pg_data:
  influx_data: